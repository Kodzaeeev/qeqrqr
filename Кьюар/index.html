rail.innerHTML=cats.map((c,i)=>`<button class="cat ${i?'':'active'}" data-target="${c}">${c}</button>`).join('');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function card(d,i){const image=I[P[i]||d[8]];return `<button class="dish" type="button" aria-label="Открыть: ${esc(d[1])}" data-index="${i}"><div class="dish-image"><img class="crop-${i%4}" src="${image}" alt="${esc(d[1])}" onerror="this.remove();this.parentElement.classList.add('image-fallback')">${d[7]?`<span class="tag">${d[7]}</span>`:''}</div><div class="dish-body"><div class="dish-top"><h3>${d[1]}</h3><span class="price">${d[4]} ₸</span></div><p>${d[2]}</p><span class="dish-ingredients" title="${esc(d[3])}">${d[3]}</span><div class="dish-bottom"><span>${d[5]}</span><span class="allergens" aria-label="${d[6]?`Аллергены: ${esc(d[6])}`:'Основные аллергены не указаны'}">${d[6]?'●':''}</span></div></div></button>`}
menu.innerHTML=cats.map(c=>{const arr=data.map((d,i)=>[d,i]).filter(([d])=>d[0]===c);return `<section class="menu-section" id="${c}"><div class="section-head"><h2>${c}</h2><span class="count">${arr.length} ПОЗИЦИИ</span></div><div class="grid">${arr.map(([d,i])=>card(d,i)).join('')}</div></section>`}).join('');
let returnFocus=null;
function showDish(i){const d=data[i], m=document.querySelector('#modal');returnFocus=document.activeElement;document.querySelector('#modalImg').src=I[P[i]||d[8]];document.querySelector('#modalImg').alt=d[1];document.querySelector('#modalTitle').textContent=d[1];document.querySelector('#modalPrice').textContent=d[4]+' ₸';document.querySelector('#modalText').textContent=d[2]+'. Каждое блюдо готовится после заказа — чтобы сохранить температуру, текстуру и характер вкуса.';document.querySelector('#modalIngredients').textContent=d[3];document.querySelector('#modalAllergens').textContent=d[6]||'Не содержит основных аллергенов';document.querySelector('#modalWeight').textContent=d[5];document.querySelector('#modalCategory').textContent=d[0];m.classList.add('open');document.body.style.overflow='hidden';document.querySelector('#modalClose').focus()}
document.addEventListener('click',e=>{const c=e.target.closest('.dish');if(c)showDish(c.dataset.index)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
function closeAll(){const wasOpen=document.querySelector('#modal').classList.contains('open')||document.querySelector('#searchLayer').classList.contains('open');document.querySelector('#modal').classList.remove('open');document.querySelector('#searchLayer').classList.remove('open');document.body.style.overflow='';if(wasOpen&&returnFocus?.focus)returnFocus.focus()}document.querySelector('#modalClose').onclick=closeAll;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeAll()};
rail.addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;document.getElementById(b.dataset.target).scrollIntoView({behavior:'smooth',block:'start'});});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.target===x.target.id));document.querySelector(`.cat[data-target="${x.target.id}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}}),{rootMargin:'-18% 0px -70% 0px'});document.querySelectorAll('.menu-section').forEach(x=>io.observe(x));
const layer=document.querySelector('#searchLayer'),inp=document.querySelector('#searchInput'),res=document.querySelector('#searchResults');document.querySelector('#openSearch').onclick=()=>{returnFocus=document.activeElement;layer.classList.add('open');setTimeout(()=>inp.focus(),50)};document.querySelector('#closeSearch').onclick=closeAll;layer.onclick=e=>{if(e.target===layer)closeAll()};inp.oninput=()=>{const q=inp.value.trim().toLocaleLowerCase('ru');if(!q){res.innerHTML='<div class="empty">Начните вводить название блюда или ингредиент.</div>';return}const found=data.map((d,i)=>[d,i]).filter(([d])=>d.slice(0,4).join(' ').toLocaleLowerCase('ru').includes(q));res.innerHTML=found.length?found.map(([d,i])=>`<button class="result" data-result="${i}"><img src="${I[P[i]||d[8]]}" alt=""><div><b>${d[1]}</b><small>${d[0]} · ${d[5]}</small></div><span>${d[4]} ₸</span></button>`).join(''):'<div class="empty">Ничего не найдено. Попробуйте другое слово.</div>'};res.onclick=e=>{const r=e.target.closest('[data-result]');if(r){const opener=returnFocus;layer.classList.remove('open');showDish(r.dataset.result);returnFocus=opener}};
document.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const open=document.querySelector('.modal.open,.search-layer.open');if(!open)return;const f=[...open.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}});
const back=document.querySelector('#backTop');window.addEventListener('scroll',()=>back.classList.toggle('show',scrollY>700),{passive:true});back.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
</body></html>
